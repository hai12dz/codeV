# =============================================================================
#  VAssist - cau hinh
#  Sua file nay roi chay lai VAssist.exe.
#
#  VAssist lam dung MOT viec:
#     ban bam chuot phai -> tool CHO delay_ms cho dao chem xong -> tool bam V
#  Khong bam V ngay luc click. Click lai giua chung thi dem lai tu dau.
#
#  BA BUOC CHO GAME THAT:
#    1) VAssist.exe --watch     -> alt-tab vao game, lay ten exe
#    2) dien ten do vao target_process ben duoi
#    3) vao game, chem thu, chinh delay_ms bang NUMPLUS / NUMMINUS cho toi khi
#       V luon an ngay sau nhat chem. Tool tu luu so moi vao file nay.
# =============================================================================

# --- Lich ------------------------------------------------------------------
# Nut bat dau dem gio. MOUSE2 = chuot phai.
#   Ten hop le: MOUSE1..MOUSE5, hoac phim: A..Z 0..9 F1..F24 SPACE TAB ...
trigger_key    = MOUSE2

# Dem gio tu luc nao:
#   down = tu luc NHAN chuot phai xuong   <- game chem ngay khi nhan
#   up   = tu luc NHA chuot phai ra       <- dung neu ban hay GIU chuot phai
#          (dao chem lien tuc khi giu, V chi nen den sau khi buong tay)
start_from     = down

# Cho bao lau roi moi bam V (mili giay). Day la con so DUY NHAT can tune.
#   Qua ngan -> V den khi dao chua chem xong -> game nuot mat V (hoac cat
#               ngang nhat chem). Day chinh la cai ban muon tranh.
#   Qua dai  -> van an, chi phi thoi gian.
# Cach tim: giam dan bang NUMMINUS cho toi khi THINH THOANG V khong an, roi
# tang lai 2 nac (~20 ms). Do la delay_ms cua ban.
# Game chi thay thoi gian theo frame: o 60 fps chinh tung buoc nho hon 17 ms
# gan nhu khong khac gi. Xem:  VAssist.exe --probe 60
delay_ms       = 700

# Click chuot phai LAN NUA trong luc V dang cho:
#   restart = dem lai tu click MOI NHAT. V luon den delay_ms sau click cuoi
#             -> khong bao gio som, du ban click doi, click ba.
#   ignore  = giu nguyen moc cua click DAU TIEN, bo qua cac click sau.
#             Nhanh hon restart neu game BO QUA click trong luc dao dang chem
#             (phan lon game deu vay).
reclick        = restart

# --- Bam gi ----------------------------------------------------------------
emit_key       = V

# Giu V bao lau (ms). Phai DAI HON 1 frame cua game: game Unity doc phim mot
# lan moi frame, bam xuong roi nha gon giua hai frame = game khong thay.
#   50 ms = an toan toi 20 fps. Tay nguoi bam binh thuong cung ~50-100 ms.
hold_ms        = 50

# Bam V may lan (1 = mot lan). >1 dung cho kieu "bam doi" huy animation.
press_count    = 1
# Nghi giua hai lan bam (ms). Cung phai > 1 frame, khong thi game thay MOT
# lan bam dai thay vi hai lan.
press_gap_ms   = 50

# Gui input kieu nao (giong BhopAssist):
#   scancode  bat buoc voi game doc DirectInput / Raw Input   <- de nguyen
#   vk        game doc WM_KEYDOWN don gian
#   both      thu cai nay khi hai cai tren deu khong an
send_mode      = scancode

# --- Bat / tat -------------------------------------------------------------
# Chuot phai cung la NGAM SUNG. Cam sung ma tool van bam V sau moi lan ngam
# thi rat phien -> tat tool khi khong cam dao.
#
# Bam la doi BAT <-> TAT. Trang thai hien o TIEU DE cua so: [BAT] / [tat]
toggle_key     = F8
start_armed    = true

# Tu dong bat/tat theo phim doi vu khi (NONE = khong dung).
# Vi du game de dao o phim 3:
#   arm_keys    = 3
#   disarm_keys = 1, 2, 4, 5
# Chi tinh khi cua so game dang focus (go so trong Discord khong lam gi ca).
# Han che: doi vu khi bang LAN CHUOT hoac Q (vu khi truoc) thi tool khong biet.
arm_keys       = NONE
disarm_keys    = NONE

# Bam la thoat ngay, nha het phim. Trung F12 cua BhopAssist -> mot phim tat ca hai.
panic_key      = F12

# --- Tune nong trong game --------------------------------------------------
# Bam trong luc choi de chinh delay_ms, khong can thoat ra. Giu phim thi no chay.
delay_up_key   = NUMPLUS
delay_down_key = NUMMINUS
delay_step_ms  = 10
# true = moi lan chinh, ghi luon so moi vao dong delay_ms o tren.
save_tuning    = true

# --- Game ------------------------------------------------------------------
# fps THAP NHAT ban tung thay trong game. Chi dung de canh bao (hold_ms va
# press_gap_ms phai vuot 1 frame o fps nay) va lam mac dinh cho --probe.
game_fps       = 60

# --- An toan ---------------------------------------------------------------
# CHI bam V khi cua so dang focus khop mot trong cac ten nay (chua chuoi,
# khong can .exe, ngan cach dau phay). Click o cua so khac -> bo qua.
# Alt-tab ra ngoai trong luc V dang cho -> huy.
# VTestbed la game thu di kem, de san de ban test truoc khi vao game.
target_process = SSJJ_BattleClient_Unity, VTestbed
require_focus  = true

# Doc chuot/phim bang gi:
#   auto = hook, tu roi ve GetAsyncKeyState neu hook bi tu choi   <- de nguyen
#   hook / poll = ep
trigger_source = auto

# true = tin ca click do PHAN MEM sinh ra (vd phan mem chuot remap mot nut
# khac thanh chuot phai). Mac dinh false: chi tin click tu tay ban.
accept_injected = false

verbose        = true
