# =============================================================================
#  BhopAssist - cau hinh
#  Sua file nay roi chay lai BhopAssist.exe.
#
#  BA BUOC CHO GAME THAT:
#    1) BhopAssist.exe --watch     -> alt-tab vao game, lay ten exe
#    2) dien ten do vao target_process ben duoi
#    3) BhopAssist.exe --probe 60  -> xem nhip hien tai co den duoc game khong
# =============================================================================

# --- Profile theo engine ---------------------------------------------------
# Day la thu quan trong nhat. Xem danh sach:  BhopAssist.exe --profiles
#
#   auto      tu nhan dien theo ten process dang focus (biet hl, cstrike, hl2,
#             csgo, cs2, bhoptestbed...). Khong nhan ra thi giu nguyen mac dinh.
#   goldsrc   Half-Life, CS 1.6, DoD, Sven      -> model LATCH, nhip nhanh
#   source    HL2, CS:S, CS:GO, CS2, L4D2       -> model LATCH, nhip nhanh
#   poll60    game doc DirectInput moi frame @ 60 fps   <- Truy Kich, CrossFire,
#   poll100   ... @ 100 fps                                cac game LithTech/F2P
#   poll144   ... @ 144 fps
#   testbed   BhopTestbed di kem
#
# Khong biet game minh thuoc loai nao? Cu de auto, vao game bam thu. Neu macro
# chay (console dem nhip) ma nhan vat khong nhay -> game doc kieu POLL, doi
# sang poll60/poll100/poll144 cho khop voi fps ban dang chay trong game.
profile        = poll100

# CHI CO TAC DUNG KHI emit = key. O emit = wheel thi so nay bi bo qua hoan toan
# (da do: game_fps 100 va 500 cho ket qua y het nhau).
#
# Ten nay dat khong ro - no KHONG phai "dien fps cua toi". Tool lay no de tinh mot
# frame dai bao nhieu, roi dat thoi gian giu phim = frame x poll_margin.
# Khai cao -> frame ngan -> giu ngan -> nhip nhanh, NHUNG de gay hon.
#
# Gay khi nao: neu fps THAT tut xuong thap hon con so ban khai, frame trong
# game dai ra trong khi thoi gian giu van ngan theo so cu -> cu nhan lot qua
# khe giua hai lan game doc ban phim. Gay im lang, khong bao gi ca.
#
# Nen no thuc chat la "nhip nay chiu duoc fps tut toi dau":
#   game_fps 100 ->  37 lan/giay,  gay neu fps duoi  79
#   game_fps 200 ->  74 lan/giay,  gay neu fps duoi 158
#   game_fps 300 -> 111 lan/giay,  gay neu fps duoi 236
#   game_fps 400 -> 148 lan/giay,  gay neu fps duoi 315
#   game_fps 500 -> 185 lan/giay,  gay neu fps duoi 394
#
# Chon sao cho con so ben phai nam DUOI fps THAP NHAT ban tung thay, khong
# phai fps luc vang. Banner in ra dong "nguong" de doi chieu.
game_fps       = 200

# Bien do an toan cho model POLL. Thoi gian giu = 1 frame x so nay.
#   1.35 = an toan, hop voi may fps dao dong
#   1.15 = nhanh hon (nhieu cu nhay/giay hon) nhung de truot khi game tut fps
poll_margin    = 1.35

# --- Kich hoat -------------------------------------------------------------
# trigger_key : phim/nut ban bam de bat tro ly.
#   Ten hop le: SPACE ENTER TAB ESC LSHIFT LCTRL LALT A..Z 0..9 F1..F12
#               NUM0..NUM9 LEFT UP RIGHT DOWN PAGEUP PAGEDOWN
#               MOUSE1..MOUSE5   MWHEELUP   MWHEELDOWN
trigger_key    = SPACE

# hold   = chi chay khi dang giu trigger_key
# toggle = bam MOT cai la BAT, bam lai la TAT. Khong phai giu -> do moi tay.
#          Trang thai hien ngay o TIEU DE cua so: [BAT] / [tat]
#
# LUU Y: dang BAT thi SPACE khong con la cu nhay binh thuong nua - bam la TAT.
#   Muon giu SPACE de nhay tay thi doi trigger sang phim khac:
#     trigger_key = MOUSE5      (nut cai chuot, tien nhat)
#     trigger_key = CAPSLOCK
#   Quen tat: bam F12 la thoat han va nha het phim.
trigger_mode   = toggle

# Doc trigger bang gi:
#   auto  = hook, tu roi ve polling neu hook bi tu choi   <- de nguyen
#   hook  = ep dung low-level hook (duy nhat cach dung khi trigger_key trung emit_key)
#   poll  = ep dung GetAsyncKeyState. CHI dung khi trigger_key KHAC emit_key,
#           vi cu KEYUP tool ban ra se xoa trang thai phim va lam trigger tu tat.
trigger_source = auto

# Bam la thoat ngay, du dang o trong game.
panic_key      = F12

# --- Ban ra gi -------------------------------------------------------------
# emit : key | wheel | both
#
# VI SAO WHEEL TOT HON KEY o game kieu POLL:
#   Phim co TRANG THAI, va game chup trang thai do moi frame. Bam xuong roi
#   len gon giua hai lan chup = coi nhu chua bam. Vi vay phim buoc phai giu
#   qua 1 frame VA nha qua 1 frame -> nhip bi tran boi frame time cua game.
#
#   Lan chuot la XUNG ROI RAC, khong co trang thai giu. Game buoc phai cong
#   don delta giua hai frame (Unity: Input.mouseScrollDelta), nen mot xung
#   ban ra o bat ky thoi diem nao cung duoc doc o frame ke tiep. Khong the
#   lot qua khe -> khong bi tran, nhip cao hon han.
#
#   Cung cau hinh: emit = key cho 74 lan/giay, emit = wheel cho 200 xung/giay.
#   Chi dung duoc neu game bind nhay len lan chuot.
#   key   -> gia lap go phim (dung khi game bind nhay = SPACE)
#   wheel -> gia lap lan chuot (dung khi game bind nhay = mwheelup/mwheeldown)
#   both  -> ca hai, cho ai bind nhay len ca phim lan lan chuot
emit           = wheel
emit_key       = SPACE

# wheel_dir : up | down | both
#   Moi nhip ban ra DUNG MOT xung, ba lua chon deu cung tan suat - khac
#   nhau o huong. 'both' lan xen ke len/xuong. Chi dung 'both' neu game
#   bind nhay len CA HAI chieu; neu mot chieu dang la doi vu khi thi no
#   se doi vu khi lien tuc.
wheel_dir      = down

# Gui input kieu nao:
#   scancode  wVk=0, gui scancode. Bat buoc voi game doc DirectInput / Raw Input.
#   vk        gui virtual-key thuan. Hop voi game doc WM_KEYDOWN don gian.
#   both      gui ca hai truong. Thu cai nay khi 2 cai tren deu khong an.
send_mode      = scancode

# --- Phim kem (bam them cung nhip voi phim nhay) ----------------------------
# Chi nhan phim ban phim: LSHIFT LCTRL LALT SHIFT CTRL ALT C V ... NONE = tat.
combo_key      = NONE

# combo_mode:
#   hold   bam MOT lan luc bat tro ly, GIU SUOT, nha khi tat.
#          <- dung cho SHIFT o game Unity/F2P, noi SHIFT = chay nuoc rut.
#             Sprint la TRANG THAI: nhap nhay no 22 lan/giay se bat/tat lien tuc.
#   with   xuong/len cung nhip voi phim nhay.
#   after  xuong SAU phim nhay combo_offset_ms.
#          <- day moi la CROUCH-JUMP that: nhay truoc, co chan sau -> len cao hon.
#             GoldSrc/Source:  combo_key = LCTRL, combo_mode = after, offset = 25
combo_mode     = hold

# Chi dung cho combo_mode = after.
combo_offset_ms = 25

# Giu phim kem bao lau moi nhip (che do with/after). 0 = giong hold cua phim nhay.
# O game kieu POLL, so nay cung phai vuot 1 frame thi game moi thay.
combo_hold_ms  = 0

# LUU Y VE SHIFT: trong GoldSrc/Source (Half-Life, CS 1.6, CS:S...) SHIFT mac
# dinh la +speed = DI BO CHAM. No KHONG lam nhay cao hon, ma con an mat toc do
# bhop. Van toc nhay la hang so cua engine, khong phim nao doi duoc.
# Muon len cao hon o dong engine do thi dung crouch-jump (LCTRL + after).
# Con o game Unity kieu SSJJ thi SHIFT thuong la sprint -> nhay XA hon.
# Tool se tu canh bao neu ban cau hinh lech voi profile dang chay.

# --- Ep nhip bang tay (de trong / 0 = theo profile) -------------------------
# Chi dien khi ban biet minh dang lam gi. profile da tinh san roi.
#
# O emit = wheel, emit_hz la con so DUY NHAT dieu khien nhip (game_fps,
# poll_margin, hold_ms deu khong dung toi). Khong co nguong gay nao ca - lan
# chuot la xung roi rac nen khong the lot khe. Tran huu ich la fps cua game:
# nhieu xung roi vao cung mot frame thi game gop lai thanh mot lan doc, nen
# ban nhanh hon fps la phi.
#   emit_hz  50 -> moi 20.0 ms mot xung   (cho trung binh 10 ms sau khi cham dat)
#   emit_hz 100 -> moi 10.0 ms            (cho  5.0 ms)
#   emit_hz 200 -> moi  5.0 ms            (cho  2.5 ms)   <- hop ly
#   emit_hz 400 -> moi  2.5 ms            (cho  1.25 ms)
#   emit_hz  : so nhip moi giay (model LATCH)
#   hold_ms  : giu phim bao lau moi nhip. O model POLL, gia tri nay bi ep
#              khong duoc thap hon 1 frame cua game.
#   jitter_pct: lech ngau nhien +-%. CHI an vao khoang NGHI, khong bao gio an
#              vao thoi gian giu -> khong lam mat cu nhan o model POLL.
emit_hz        = 100
hold_ms        = 0
jitter_pct     = -1

# --- An toan ---------------------------------------------------------------
# CHI ban input khi cua so dang focus khop mot trong cac ten nay.
# Ngan cach bang dau phay, so khop kieu "chua chuoi" (khong can .exe).
# De trong = moi cua so (rat de spam SPACE ra Discord/Explorer).
#
# Lay ten bang:  BhopAssist.exe --watch
# Vi du:  target_process = hl, cstrike, bhoptestbed
target_process = SSJJ_BattleClient_Unity
require_focus  = true

verbose        = true
